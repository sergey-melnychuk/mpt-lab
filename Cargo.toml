[workspace]
members = ["crates/*"]
# mpt-reth pulls reth via git (a large, slow-to-build dependency tree), so it
# stays out of the default member set: plain `cargo build`/`cargo test` must
# not build it. `cargo build -p mpt-reth` or `--workspace` still can.
default-members = ["crates/mpt-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
eyre = "0.6"
sha3 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
proptest = "1"
thiserror = { version = "2.0", default-features = false }

## Uncomment to build against a local yevm checkout instead of the pinned git
## rev below -- handy while developing yevm and mpt-lab changes together.
#[patch."https://github.com/sergey-melnychuk/yevm.git"]
#yevm-core = { path = "/home/work/Code/yevm/yevm-core" }
#yevm-reth = { path = "/home/work/Code/yevm/yevm-reth" }
#yevm-base = { path = "/home/work/Code/yevm/yevm-base" }
