[package]
name = "mpt-reth"
version = "0.1.0"
edition = "2024"
publish = false

# reth 2.5.1 requires rust-version 1.95.
#
# reth is NOT usefully published to crates.io (the `reth-*` crates there are
# 0.0.0 placeholders), so pin the git tag. Note this pulls a large dependency
# tree — expect a long first build.
#
# Keep this crate OUT of the main workspace's default members, or `cargo test`
# at the root will build all of reth. Either add it as a separate workspace, or
# in the root Cargo.toml:
#
#     [workspace]
#     members  = ["crates/mpt-core"]
#     exclude  = ["crates/mpt-reth"]

[dependencies]
mpt-core = { path = "../mpt-core" }

reth-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1", features = ["node"] }
alloy-primitives = "1"

rlp = "0.6"
hex = "0.4"
eyre.workspace = true

[dev-dependencies]
# Path deps into the user's local yevm checkout — the git remote is a private
# SSH URL, and yevm-reth pins the SAME reth v2.5.1 tag this crate already
# does, against the SAME local datadir (see examples/block.rs).
yevm-core = { path = "/home/work/Code/yevm/yevm-core" }
yevm-reth = { path = "/home/work/Code/yevm/yevm-reth" }
yevm-base = { path = "/home/work/Code/yevm/yevm-base" }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
alloy-rlp = "0.3"
alloy-consensus = "2"

[profile.release]
debug = true
