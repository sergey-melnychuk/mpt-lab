[package]
name = "mpt-reth"
version = "0.1.0"
edition = "2024"
publish = false

# reth 2.5.1 requires rust-version 1.95.
#
# reth is NOT usefully published to crates.io (the `reth-*` crates there are
# 0.0.0 placeholders), so pin the git tag. Note this pulls a large dependency
# tree — expect a long first build.
#
# Keep this crate OUT of the main workspace's default members, or `cargo test`
# at the root will build all of reth. Either add it as a separate workspace, or
# in the root Cargo.toml:
#
#     [workspace]
#     members  = ["crates/mpt-core"]
#     exclude  = ["crates/mpt-reth"]

[dependencies]
mpt-core = { path = "../mpt-core" }

reth-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1", features = ["node"] }
alloy-primitives = "1"

rlp = "0.6"
hex = "0.4"
eyre.workspace = true

[dev-dependencies]
# yevm pinned to a commit on its `reth` branch. yevm-reth pins the SAME reth
# v2.5.1 tag this crate already does, against the SAME local datadir (see
# examples/block.rs). Bump all three revs together — they are one workspace.
yevm-core = { git = "https://github.com/sergey-melnychuk/yevm.git", rev = "3c8a7181a71e2ad963070ba62d533f600c67d6e8" }
yevm-reth = { git = "https://github.com/sergey-melnychuk/yevm.git", rev = "3c8a7181a71e2ad963070ba62d533f600c67d6e8" }
yevm-base = { git = "https://github.com/sergey-melnychuk/yevm.git", rev = "3c8a7181a71e2ad963070ba62d533f600c67d6e8" }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
alloy-rlp = "0.3"
alloy-consensus = "2"

[profile.release]
debug = true
